appId: ai.deepseek.dsh.desktop
# productName 里**不能有空格**。
#
# 空格会导致 metadata 与 Release 附件名不一致，而外壳自动更新正是靠两者匹配来
# 定位下载文件的。实测过一轮发布：
#     electron-builder 生成的 latest.yml : DeepSeek-Harness-x64.exe   （空格 -> 连字符）
#     Release 上实际的附件              : DeepSeek.Harness-x64.exe   （空格 -> 点）
# 两者不匹配，electron-updater 会 404。用不带空格的名字后两处逐字相同。
#
# 这个名字同时决定：安装目录、可执行文件名、产物文件名。
# 面向用户的显示名由 shortcutName 与窗口标题单独设置，因此仍是「DeepSeek Harness」。
productName: dsh-desktop
copyright: MIT Licensed — bundles the official DeepSeek Harness runtime

directories:
  # 每个版本一个目录：release/1.0.0/…，产物文件名里不再带版本号。
  # 依据：`appInfo` 带有 `version` 字段（app-builder-lib 的 AppInfo 构造函数），
  # 而 macroExpander 的最后分支就是 `if (p1 in appInfo) return appInfo[p1]`，
  # 所以 output 里用 ${version} 是合法宏。
  output: release/${version}
  buildResources: build

# 只随包携带应用真正会用的两套 Electron locale。
#
# 默认会带上 Chromium 的全部 55 种语言包，实测 **40.3 MiB**（最大几个：ml 1.41、
# ta 1.40、kn 1.36、te 1.30、hi 1.26 MiB）。界面本身只有中英两套（见 src/main/i18n.ts），
# 因此保留 en-US 与 zh-CN 即可；其余语言下 Chromium 会走它自己的 fallback（en-US）。
#
# 注意：这不影响**系统语言 fallback**——`app.getLocale()` 仍返回真实系统语言，
# 只是找不到对应 .pak 时由 Chromium 回落到 en-US，而不是崩溃或白屏。
electronLanguages:
  - en-US
  - zh-CN

# `compression` is a top-level option, not an nsis/msi child.
#
# 刻意留到**最后**才比较：先做完 A–F 的架构优化（去掉第二份 Node、去掉 runtime.br 双交付、
# 去掉生产 npm、精简 locale、裁剪 Runtime），再回来量 normal vs maximum 的
# installer size / build duration / install duration。最大压缩不是主要手段：它换来的
# 通常只有几个百分点，而代价是构建时间与内存（`maximum` 会切到更重的 solid 模式）。
compression: normal

# src/server/server.mjs ships as a resource rather than being compiled, since it is
# a plain Node ESM script. `stage-runtime.mjs` also copies it into `runtime/`, which
# is where the child actually runs it from (see `serverRunEntry` in src/main/paths.ts):
# inside app.asar nothing can be written at startup, so the copy must already be there.
extraResources:
  # 随应用携带的客户端插件（gitbar / review / typography / shell-bridge）。
  #
  # 插件不在 dsh 的依赖闭包里；开发运行与打包运行都需要外壳在启动时同步与当前版本配套的
  # 插件（见 plugin-sync.ts）。这份散文件是不依赖运行时目录布局的来源，也保证外壳、插件
  # 与 bundled Runtime 总是来自同一个 Release。
  #
  # 刻意不加 `filter` 白名单：插件将来多一个 .mjs / .cjs 文件时，白名单会**静默漏掉**
  # 它，而那只有在打包后的应用里才暴露出来。整个目录只有十几 KB 的源码，全带上更安全。
  - from: plugins
    to: plugins
  - from: src/server
    to: server
    filter:
      - 'server.mjs'
      - 'client-module-cache.mjs'
  - from: build/icon.png
    to: icon.png

# 应用代码 + **完整 Runtime** 一起进 app.asar。
#
# 这一版不再交付 `runtime.br`：那是 brotli 归档 + 首次启动解压（实测解压 189.7 MiB、
# 约 9 秒），而且 .br 本身已经压缩过，NSIS 再也压不动它。Runtime 的 JS / JSON / 普通资源
# 直接进 asar，由 NSIS 统一 LZMA 压缩——"安装包体积"与"解压等待"这两件事一起消失。
#
# 只有**必须真实落盘**的东西才排除在 asar 之外：
#   * `runtime/node/**` —— 第二份 portable Node。Electron 自身在 Node 模式下就是
#     Node 24（`process.execPath` + `ELECTRON_RUN_AS_NODE=1`），不再需要它；
#   * native 可执行文件（.node/.dll/.exe/.so/.dylib）—— `dlopen` 与 `spawn` 都要真实
#     文件，交给下面的 asarUnpack。
files:
  - dist/**/*
  - package.json
  # Runtime 是**裁剪后**的那棵树（`npm run prepare:runtime` 生成），不是 `runtime/` 原样。
  # 策略见 scripts/runtime-file-policy.mjs：便携 Node、LibreOffice 平台负载、source map、
  # .d.ts、tests/fixtures/examples、非目标平台 native 都会在这里被剔除，并且每条理由各占
  # 多少字节都由 `--report` 打出来。进入 asar 后落在 `runtime/`，与开发期布局一致。
  - from: build/runtime-desktop
    to: runtime
  - '!**/*.map'
  - '!**/*.ts'
  - '!release/**'
  - '!scripts/**'
  # 插件只以 extraResources 的形式随包发布（见上面那段说明）：进 app.asar 没有用处。
  - '!plugins/**'

# 只有加载器必须按真实路径打开的 native 二进制才 unpack，其余一律留在 app.asar 里。
asarUnpack:
  - 'runtime/**/*.node'
  - 'runtime/**/*.dll'
  - 'runtime/**/*.exe'
  - 'runtime/**/*.so'
  - 'runtime/**/*.dylib'

# **必须**打开：electron-builder 默认会跳过**任何**层级的 `node_modules` 目录
# （`AppFileWalker.createAppFilter` 里只要 `file.endsWith('/node_modules')` 就返回
# `includeSubNodeModules`，默认 false），而桌面版携带的 Runtime 正是一棵完整的嵌套安装树
# （`runtime/node_modules/**`，其中还有 `@deepseek-ai/dsh/node_modules/**`）。
#
# 不打开时的表现极具误导性：打包**成功**、asar 里也有 `runtime/`，但只剩
# `runtime/package.json`、`server.mjs` 这几个直接位于根下的文件，`runtime/node_modules`
# 整个消失——装出来的应用启动即 "no bundled dsh runtime found"。
#
# 打开它不会让仓库根部的 node_modules 被重复收进 asar：根部依赖仍由 electron-builder 的
# 依赖求解器（只装 production dependencies）负责，我们的 `files` 里并没有匹配根部
# `node_modules` 的正向模式。
includeSubNodeModules: true

# ---------------------------------------------------------------- Windows -----
win:
  icon: build/icon.png
  target:
    # 只出 NSIS。**MSI 不再随 Release 发布**（见 .github/workflows/release.yml 里的说明）。
    #
    # 不再发布的两个原因：
    #   * 它的安装界面只有英文——MsiTarget 不提供语言选项，其 WiX 工具链不含本地化文件，
    #     中文 MSI 需要自建 WiX UI 扩展；
    #   * 构建需要很短的路径根。这份应用的运行时树很深（@opentelemetry 等），WiX 的
    #     light.exe 受 MAX_PATH(260) 限制，CI 的构建路径正好越线，必须绕 junction，
    #     而报错是 LGHT0103「找不到文件」，完全看不出是路径长度问题。
    #
    # 目标本身保留，需要时可在本地出（本地路径短，无需 Junction）：
    #   npx electron-builder --win msi --x64
    - target: nsis
      arch: [x64]
  # 文件名不带版本号：版本已经在目录名里（release/${version}/）。
  # 保留 ${arch}，因为同平台多架构产物必须区分（macOS x64 与 arm64）。
  artifactName: ${productName}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness

  # 安装界面语言：简体中文。
  #
  # 只设两个选项，依据 app-builder-lib/out/targets/nsis/nsisLang.js 的
  # LangConfigurator：
  #
  #   * `installerLanguages` 是**语言名**（zh_CN），代码里映射到 NSIS 自带的
  #     SimpChinese.nlf/.nsh，决定编入哪些语言。
  #   * `language` 是 **LCID 十进制**，不是语言名：默认 "1033"（英文美国），
  #     简体中文是 2052（util/langs.js 里 `zh_CN: 2052`）。写成 "zh_CN" 会让
  #     makensis 报 `VIAddVersionKey: "/LANG=zh_CN" is not a valid language code!`
  #
  # ⚠ 不要设 `multiLanguageInstaller: false`。看 LangConfigurator：
  #
  #     this.isMultiLang = options.multiLanguageInstaller !== false
  #     if (this.isMultiLang) this.langs = installerLanguages.map(...)
  #     else                  this.langs = ["en_US"]      // ← 语言被强制成英文
  #
  # 设成 false 会让 installerLanguages **被完全忽略**、界面退回英文——我在这里
  # 踩过一次，安装器仍显示英文的 "Choose Installation Options"。
  # 只列一种语言时 NSIS 本来就不会弹语言选择窗，不需要额外关它。
  #
  # electron-builder 自己的字符串有两张表，且都已覆盖 zh_CN：
  #   templates/nsis/messages.yml          （installing / uninstall 确认等）
  #   templates/nsis/assistedMessages.yml  （多用户安装页，17 条全有 zh_CN）
  language: 2052
  installerLanguages:
    - zh_CN
  uninstallDisplayName: DeepSeek Harness

msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness

# ------------------------------------------------------------------ macOS -----
# Must be built on macOS: electron-builder shells out to hdiutil/codesign, which
# have no Windows or Linux equivalent. Use the GitHub Actions workflow
# (.github/workflows/release.yml), whose macos runner handles this job.
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    # Leave architecture to the CLI. CI passes exactly one --x64 / --arm64 per
    # matrix job; embedding both here makes each job build both architectures,
    # even when its staged Node runtime only matches the runner's architecture.
    - dmg
    - zip
  # 文件名里不带版本号：版本已经在目录名中（release/${version}/）。
  # 保留 ${arch}，因为同平台的多架构产物必须区分（macOS x64 与 arm64）。
  artifactName: ${productName}-${arch}.${ext}
  # Unsigned builds are quarantined by Gatekeeper. Setting an identity requires an
  # Apple Developer certificate; notarization additionally needs an app-specific
  # password. Leave hardenedRuntime on so signing works unchanged once a
  # certificate is configured.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  # 文件名里不带版本号：版本已经在目录名中（release/${version}/）。
  # 保留 ${arch}，因为同平台的多架构产物必须区分（macOS x64 与 arm64）。
  artifactName: ${productName}-${arch}.${ext}

# ------------------------------------------------------------------ Linux -----
# 只产出 AppImage 与 deb；**不产出 .rpm**（未列入 target，CI 也不装 rpmbuild）。
# 两者都无法在 Windows 构建机上生成——AppImage 需要 Linux 版 mksquashfs，
# deb 需要 fpm，都是 Linux 可执行文件，因此交给 CI 的 ubuntu runner。
linux:
  icon: build/icon.png
  category: Development
  synopsis: DeepSeek Harness desktop client
  description: >-
    Desktop client for the DeepSeek Harness (dsh) agent runtime. Bundles the
    runtime and a pinned Node, so no Node.js or npm install is required.
  # deb metadata: fpm refuses to build without a maintainer, and
  # electron-builder falls back to package.json's author field, which has no
  # email here. Replace with the real maintainer before publishing.
  maintainer: dsh-desktop contributors <maintainer@example.com>
  desktop:
    entry:
      Name: DeepSeek Harness
      Comment: DeepSeek Harness agent runtime
      Categories: Development;Utility;
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # 文件名里不带版本号：版本已经在目录名中（release/${version}/）。
  # 保留 ${arch}，因为同平台的多架构产物必须区分（macOS x64 与 arm64）。
  artifactName: ${productName}-${arch}.${ext}

appImage:
  # 文件名里不带版本号：版本已经在目录名中（release/${version}/）。
  # 保留 ${arch}，因为同平台的多架构产物必须区分（macOS x64 与 arm64）。
  artifactName: ${productName}-${arch}.${ext}

deb:
  # The runtime spawns a terminal and needs the OS keychain for credential
  # encryption; without libsecret electron's safeStorage reports unavailable.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
    - libdrm2
    - libgbm1

# Shell self-updates: electron-updater reads this shape from app-update.yml inside
# the package. GitHub Releases is the default publishing target.
publish:
  provider: github
  owner: pucj0
  repo: deepseek-harness-desktop
  releaseType: release
