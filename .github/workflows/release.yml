name: release

# 三个平台各用自己的 runner 打包，因为产物必须在目标平台上生成：
#   * macOS 的 .dmg 需要 hdiutil / codesign / productbuild，只在 macOS 上存在
#   * Linux 的 AppImage 需要 mksquashfs 工具链（electron-builder 会下载静态包）
#   * Windows 的 .exe（NSIS）需要 makensis
#
# 注意：**不产出 .rpm**。electron-builder.yml 的 linux.target 只有 AppImage 与 deb，
# 因此这里不装 rpmbuild；下面的收集与校验规则里也没有 .rpm。
#
# 触发方式：
#   * 推送 v* 标签            -> 打包并创建 GitHub Release
#   * Actions 页面手动触发    -> 只打包，产物作为 workflow artifact 上传

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 上游 Node 与 electron-builder 工具的镜像。
  ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
  DSH_NODE_VERSION: v24.17.0
  # 打印 electron-builder 的详细决策过程。CI 上一次失败只给一行结论，
  # 打开这个才能看到它在哪一步、为什么停下来。
  DEBUG: electron-builder,electron-builder:*

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响其它平台出产物。
      fail-fast: false
      matrix:
        include:
          - name: Windows (setup.exe)
            os: windows-latest
            target: win
          - name: Linux (AppImage + deb)
            os: ubuntu-latest
            target: linux
          - name: macOS (dmg + zip, x64 + arm64)
            os: macos-latest
            target: mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 环境信息
        shell: bash
        run: |
          echo "node      : $(node -v)"
          echo "npm       : $(npm -v)"
          echo "platform  : ${{ runner.os }} / $(uname -m)"
          echo "ref       : ${{ github.ref }}"

      - name: 安装依赖
        run: npm ci
        # npm ci 会跑 postinstall 的 link-runtime.mjs；此时 runtime/ 还不存在，
        # 脚本会打印提示并正常退出，不是错误。

      - name: 编译 TypeScript
        run: npm run build

      # 与"编译 TypeScript"有重叠，但保留：一旦 checkout 出的内容有问题，这一步的
      # 报错更直白（明确列出哪个相对 import 找不到目标文件），而 tsc 的报错容易被
      # 误读成环境问题。历史上两次 CI 失败都源于改了文件却没提交。
      - name: 确认提交内容自洽
        run: node scripts/check-imports.mjs

      - name: 校验便携 Node 归档名解析
        # 早期哨兵：归档名拼错时本机会被 alreadyStaged() 短路掩盖，只有干净的
        # CI checkout 才暴露。这一步零成本，几秒内就能把这类错误挡在下载之前。
        # 注意：这里**不调用** npm run icon。build/icon.png 已入库且是有效 PNG，
        # 重新生成只会把一个可能损坏的已入库资源悄悄覆盖掉；
        # 它是否有效交给下一节的检查来说明。
        run: node scripts/stage-node.mjs --names

      - name: 校验图标资源
        shell: bash
        run: |
          set -e
          # 尺寸下限是硬性的，而且各平台要求不同：
          #   * macOS 拒绝小于 512x512 的源图
          #     （报错："cannot convert icon … must be at least 512x512"）
          #   * Windows 的 .ico 需要多个尺寸，源图太小会被放大而模糊
          # 因此这里要求 >= 512，而不是想当然的 256。
          # 只校验、不重新生成：build/icon.png 是入库的正式资源，
          # 用 `npm run icon` 覆盖它会把有意的品牌图悄悄换回占位图。
          test -f build/icon.png || { echo "::error::build/icon.png 缺失（它必须入库）"; exit 1; }
          node -e "
            const fs = require('node:fs')
            const b = fs.readFileSync('build/icon.png')
            const png = b[0] === 0x89 && b.subarray(1, 4).toString() === 'PNG'
            if (!png) { console.error('::error::build/icon.png 不是有效 PNG'); process.exit(1) }
            const width = b.readUInt32BE(16)
            const height = b.readUInt32BE(20)
            console.log('icon.png', width + 'x' + height, b.length + ' bytes')
            if (width < 512 || height < 512) {
              console.error('::error::图标至少需要 512x512（macOS 打包的硬性要求）')
              process.exit(1)
            }
          "
          # .icns 与 .ico 都由 electron-builder 从这张 PNG 派生，不需要额外工具。

      - name: 准备内置运行时与便携 Node
        run: npm run stage
        # stage = stage:runtime + stage:node + link:runtime + compress:runtime。
        # stage:node 不带参数时自动按当前平台/架构下载，无需在 CI 里区分。
        # compress:runtime 把瘦身后的运行时压成 build/runtime.br（42.9 MB），
        # 安装包携带的是这个归档而不是散开的 27 400 个文件。brotli q11 要跑约 11 分钟，
        # 在 macOS 与 Windows 上都是如此——这是为了让安装包小 100 MB 以上付出的构建时间。

      - name: 确认运行时已就位
        shell: bash
        run: |
          set -e
          test -f runtime/node_modules/@deepseek-ai/dsh/package.json || {
            echo "::error::staged 运行时缺失"; exit 1; }
          # 先落到变量再 echo：把 node -p "..." 直接嵌进双引号里会因为引号嵌套
          # 被 shell 拆坏，这是很容易忽略的写法错误。
          staged=$(node -p 'require("./runtime/node_modules/@deepseek-ai/dsh/package.json").version')
          echo "dsh staged: $staged"
          ls -la runtime/node | head -20

      # 归档缺失时直接失败。
      #
      # electron-builder.yml 的 extraResources 只携带 build/runtime.br；缺了它打包**不会
      # 报错**，只会产出一个没有运行时的安装包——用户装完打不开。这种"成功但不可用"的
      # 失败最难发现，所以在打包前先挡掉。
      - name: 确认运行时归档已生成
        shell: bash
        run: |
          set -e
          test -f build/runtime.br || {
            echo "::error::缺少 build/runtime.br —— npm run stage 里的 compress:runtime 没跑成功"; exit 1; }
          ls -la build/runtime.br
          cat build/runtime.json

      # ---------------------------------------------------------------- Windows
      - name: 打包 Windows (NSIS setup.exe)
        if: matrix.target == 'win'
        # --publish never：发布由最后那个独立的 release job 统一做，避免三个平台
        # 各自去创建 Release 而互相冲突。
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 说明：这里原本还有一个「打包 Windows (MSI)」步骤，现已移除。
      #
      # MSI 曾经的价值是企业批量部署（组策略），但要为此付出两个代价：
      #   * 它必须从很短的构建根（C:\b）里生成，因为 WiX 的 light.exe 受 MAX_PATH
      #     260 限制，而运行时树里 @opentelemetry 嵌套很深，CI 的路径长度正好越线；
      #   * 它的安装界面只有英文——electron-builder 的 MsiTarget 不提供语言选项，
      #     其 WiX 工具链不含本地化文件，中文 MSI 需要自建 WiX UI 扩展。
      # 两相权衡后不再随 Release 发布。
      #
      # MSI 目标仍保留在 electron-builder.yml 里，需要时可在本地出：
      #   npx electron-builder --win msi --x64

      # ------------------------------------------------------------------ Linux
      - name: 打包 Linux
        if: matrix.target == 'linux'
        run: |
          # `rpm` 只是为了给 electron-builder 的 rpm 目标备用：本项目**不发布 .rpm**
          # （linux.target 只有 AppImage + deb），这一步对当前产物没有作用。
          # 保留而不删除，是因为它同时把 apt 索引刷新到最新，改 Linux 目标时可直接用。
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          npx electron-builder --linux --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ macOS
      #
      # 签名分两种情形，各自一个步骤，由仓库变量 SIGN_MACOS 选择。
      #
      # 为什么不能在 `if:` 里判断 secret：GitHub Actions 不允许在 step 级 `if`
      # 里引用 `secrets` 上下文，写了会让整个工作流直接报错。
      #
      # 为什么不能只用一个步骤、把 CSC_LINK 设成 secret：未配置的 secret 会被
      # 展开成**空字符串**。electron-builder 看到 CSC_LINK 有定义就去准备签名
      # 钥匙串，然后把空字符串当文件路径，报出
      #   ⨯ /Users/runner/work/…/deepseek-harness-desktop not a file
      # （它把项目根目录当成证书）。所以未配置证书时这些变量必须**根本不存在**。
      #
      # 启用签名：在仓库 Settings → Secrets and variables → Actions 里
      #   * Variables 新增 SIGN_MACOS = true
      #   * Secrets  新增 MAC_CERT_P12 / MAC_CERT_PASSWORD（以及可选的公证三项）
      #
      # 便携 Node 的架构自动跟随 runner（macos-latest 是 arm64），因此 x64 产物
      # 由 --x64 交叉构建，不需要手工替换 runtime/node。
      - name: 打包 macOS (x64)
        if: matrix.target == 'mac' && vars.SIGN_MACOS != 'true'
        run: npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包 macOS (x64, 已签名)
        if: matrix.target == 'mac' && vars.SIGN_MACOS == 'true'
        run: npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: 打包 macOS (arm64)
        if: matrix.target == 'mac' && vars.SIGN_MACOS != 'true'
        run: npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包 macOS (arm64, 已签名)
        if: matrix.target == 'mac' && vars.SIGN_MACOS == 'true'
        run: npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ------------------------------------------------------------------ 诊断
      - name: 列出产物目录
        if: always()
        shell: bash
        run: |
          echo "=== release/ ==="
          ls -laR release 2>/dev/null | head -60 || echo "release/ 不存在"

      # ------------------------------------------------------------------ 上传
      #
      # 先把安装包收进一个**专用目录**再上传，而不是直接匹配 release/**。
      #
      # 原因是踩过的坑：upload-artifact 会把匹配到的所有文件按**共同祖先**压平，
      # 而 release/<版本>/win-unpacked/ 里也躺着构建工具产物（node.exe、
      # node-pty 的 OpenConsole.exe、ripgrep 的 rg.exe、node_pdb.zip 等）。
      # 用 release/**/*.exe 之类递归匹配时它们会一并被收进去，最终把一堆无关
      # 二进制传进 Release，并在改名时触发 "Not Found" 失败。
      #
      # 只从 <版本>/ 这一层取扩展名匹配的文件，天然排除了 win-unpacked 子树。
      # 用 find 而不是 shell glob，因为 PowerShell 与 bash 的 glob 语义不一致。
      - name: 收集安装包
        if: always()
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # release/<版本>/<文件>：只取这一层的文件，不递归。
          #
          # 不发 `.blockmap`：它是 electron-builder 为**差分下载**生成的索引，只有
          # 联网自动更新才用得到，对下载安装包的用户没有意义，列在 Release 里纯属噪音。
          # 去掉它不影响 electron-updater——新版会退回全量下载那个安装包本身。
          find release -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.dmg' -o -name '*.zip' \
               -o -name 'latest*.yml' \) \
            -exec cp -v {} dist-artifacts/ \;
          echo "--- dist-artifacts ---"
          ls -la dist-artifacts || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.target }}
          # 只传上一步收集好的结果：目录是扁平的，因此 artifacts/<文件> 这种
          # 一层匹配在发布的 job 里就能正确工作。
          path: dist-artifacts/*
          # 打包本身失败时上面可能没有文件；此时上传步骤不该再报一个
          # 二次错误把真正的原因掩盖掉。
          if-no-files-found: warn
          retention-days: 14

  release:
    name: 创建 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 必须先检出仓库：发布说明来自仓库里的 RELEASE_NOTES.md。
      #
      # 这一步最初漏了，导致「读取发布说明」报 "缺少 RELEASE_NOTES.md" —— 文件在
      # 标签里明明存在，只是这个 job 之前只下载构建产物、从未检出源码，工作目录里
      # 自然没有它。不要删。
      - uses: actions/checkout@v4

      # 只为了跑 `scripts/release-notes.mjs`（纯 Node、无依赖）。runner 自带的 Node 版本
      # 会随镜像变化，显式装一个可以让"取说明"这一步的输出长期稳定。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出将要发布的文件
        run: ls -laR artifacts | head -60

      # 显式校验"确实有可发布的产物"，否则直接失败。
      #
      # 为什么需要：曾用 `files: artifacts/*`，而 upload-artifact 会把文件放进
      # 子目录，于是 glob 一个文件都匹配不到；softprops/action-gh-release 对空匹配
      # **不报错**——结果是 Release 正常发布、里面却只有 GitHub 自动附带的源码包。
      # 这种"成功但为空"的失败最难发现，所以在这里挡掉。
      - name: 确认产物存在
        run: |
          count=$(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name 'latest*.yml' \) | wc -l)
          echo "找到 $count 个可发布文件"
          find artifacts -type f | head -40
          if [ "$count" -eq 0 ]; then
            echo "::error::没有可发布的产物——检查 download-artifact 的结果与 files 的 glob"
            exit 1
          fi
          # blockmap 不该出现在 Release 里（对下载用户无意义，只是噪音）。
          # 若它又混进来，在这里直接失败，而不是等发完之后被人发现。
          if find artifacts -type f -name '*.blockmap' | grep -q .; then
            echo "::error::产物里含 .blockmap，构建阶段的收集规则应排除它"
            find artifacts -type f -name '*.blockmap'
            exit 1
          fi

      # 取出本次的发布说明。
      #
      # 说明写在仓库的 RELEASE_NOTES.md 里（release.mjs 会强制对应的一节存在且不像没写完），
      # 这里用 `scripts/release-notes.mjs --extract <版本>` 取出**本版本的那一节**，
      # 再填进 Release 正文。
      #
      # **不要再改回 `cat RELEASE_NOTES.md`。** 那个写法踩过一次很显眼的坑：这个文件是
      # 累积的变更日志（旧版本用 `---` 分隔留在下面，方便用户回看历史），整篇塞进正文的
      # 结果就是 v1.4.4 的 Release 里带着 1.4.3、1.4.2……一直回到 1.3.1 的全部说明——
      # 用户点开"本次更新"看到的是一年半的更新日志。取哪一段的规则只有一份实现
      # （scripts/release-notes.mjs），CI 与 release.mjs、以及回归测试共用它。
      - name: 读取发布说明
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "本次版本: $version"
          if ! node scripts/release-notes.mjs --extract "$version" > notes.md; then
            echo "::error::RELEASE_NOTES.md 里没有 $version 那一节"
            exit 1
          fi
          echo "本次说明:"
          cat notes.md
          # 多行内容要用 heredoc 形式写进 GITHUB_OUTPUT。
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          # 递归匹配：各平台的 artifact 解压后可能各自带一层目录。
          # 构建阶段已把安装包收进扁平的 dist-artifacts/，因此这里不会像
          # 之前那样把 win-unpacked 里的 node.exe / OpenConsole.exe 一并收进来。
          files: artifacts/**/*
          # draft: false —— 直接发布。
          #
          # 这里曾是 true，导致 Releases 页面**什么都看不到**：GitHub 只展示已发布
          # 的版本，草稿仅对所有者可见。产物其实全都上传成功了，但对外不可见，
          # 容易被误判为"发布失败"。
          # 需要人工复核流程时再改回 true。
          draft: false
          # generate_release_notes 会把该标签之前的提交列表附在正文末尾，作为
          # 「完整变更」；上面手工写的说明才是用户先看到的摘要。
          generate_release_notes: true
          # 正文 = 本次更新说明（来自 RELEASE_NOTES.md）+ 固定的附件与注意事项。
          body: |
            ${{ steps.notes.outputs.body }}

            ---

            ### 安装包

            | 平台 | 文件 |
            |---|---|
            | Windows | `dsh-desktop-x64.exe`（NSIS 安装程序，**中文界面**） |
            | Linux | `dsh-desktop-x86_64.AppImage`、`-amd64.deb` |
            | macOS | `dsh-desktop-x64.dmg`、`-arm64.dmg` 及对应 `.zip` |

            文件名里不带版本号，版本体现在 Release 标签上。

            **Windows 安装界面为简体中文。** 不再附带 `.msi`：它的安装界面只有英文
            （electron-builder 的 MsiTarget 不提供语言选项），且构建需要很短的路径根，
            价值与代价不成比例。需要 MSI 时可在本地用
            `npx electron-builder --win msi --x64` 生成。

            macOS 产物未签名（未配置 Apple 开发者证书），首次打开请右键 → 打开。

            > **维护者注意：文件名不要改。** `latest.yml` / `latest-mac.yml` /
            > `latest-linux.yml` 里的 `url` 必须与附件名**逐字一致**，否则应用内自动
            > 更新会 404。`productName` 里带空格时踩过：electron-builder 生成
            > `DeepSeek-Harness-x64.exe`（空格→连字符），而 GitHub 上传后是
            > `DeepSeek.Harness-x64.exe`（空格→点），两者不匹配。
